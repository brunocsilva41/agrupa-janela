name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nada por padrão; o job pede só o que precisa.
permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore AgrupaJanela.sln

      - name: Build (Release)
        run: dotnet build AgrupaJanela.sln -c Release --no-restore

      # Roda cada projeto de teste em tests/ (inclusive os que ainda não estão no .sln).
      # Dados do app em pasta de CI (SPLITDECK_DATA): não toca em %APPDATA% do runner.
      # Resultados TRX e cobertura (coletor nativo, cobertura Cobertura) vão para TestResults/.
      - name: Testes
        if: hashFiles('tests/**/*.csproj') != ''
        shell: pwsh
        run: |
          $env:SPLITDECK_DATA = "$env:RUNNER_TEMP\splitdeck-ci"
          $projects = Get-ChildItem -Path tests -Recurse -Filter *.csproj
          foreach ($p in $projects) {
            Write-Host "==> dotnet test $($p.FullName)"
            dotnet test $p.FullName -c Release --logger "trx;LogFileName=$($p.BaseName).trx" --results-directory TestResults --collect "Code Coverage;Format=cobertura"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('TestResults/**') != ''
        with:
          name: testes-ci-${{ github.sha }}
          path: TestResults
          if-no-files-found: warn
          retention-days: 14

      - name: Pacote (0.0.0-ci)
        shell: pwsh
        run: ./build/package.ps1 -Version 0.0.0-ci

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: agrupajanela-ci-${{ github.sha }}
          path: |
            artifacts/SplitDeck-Setup-0.0.0-ci.exe
            artifacts/SplitDeck-0.0.0-ci-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
