name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore AgrupaJanela.sln

      - name: Build (Release)
        run: dotnet build AgrupaJanela.sln -c Release --no-restore

      # Roda cada projeto de teste em tests/ (inclusive os que ainda não estão no .sln).
      - name: Testes
        if: hashFiles('tests/**/*.csproj') != ''
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path tests -Recurse -Filter *.csproj
          foreach ($p in $projects) {
            Write-Host "==> dotnet test $($p.FullName)"
            dotnet test $p.FullName -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Pacote (0.0.0-ci)
        shell: pwsh
        run: ./build/package.ps1 -Version 0.0.0-ci

      - uses: actions/upload-artifact@v7
        with:
          name: agrupajanela-ci-${{ github.sha }}
          path: |
            artifacts/SplitDeck-Setup-0.0.0-ci.exe
            artifacts/SplitDeck-0.0.0-ci-win-x64.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
